{% extends "layout.html" %}

{% block container %}
<div class="w-full max-w-5xl mx-auto px-4 mt-6">
  <div class="mb-4 px-4 py-3 bg-neutral-primary-soft rounded-base border border-default">
    <h1 class="text-2xl font-bold text-heading mb-2">Detalle del Maestro</h1>
    <p class="text-body mb-0">Vista detallada con el formato de tarjeta.</p>
  </div>

  <div class="flex flex-col md:flex-row items-start bg-neutral-primary-soft p-6 border border-default rounded-base shadow-xs gap-6">
    <img class="object-cover rounded-base" style="width: 160px; height: 160px; max-width: 160px; flex: 0 0 160px;" src="{{ url_for('static', filename='img/IDGS805.jpg') }}" alt="Maestro">
    <div class="flex flex-col justify-between leading-normal w-full min-w-0">
      <h5 class="mb-2 text-2xl font-bold tracking-tight text-heading break-words">{{ nombre }} {{ apellidos }}</h5>
      <p class="mb-2 text-body break-words">Especialidad: {{ especialidad }}</p>
      <p class="mb-2 text-body break-words">Matrícula: {{ matricula }}</p>
      <p class="mb-6 text-body break-words">Correo: {{ email }}</p>
      <div>
        <a href="{{ url_for('maestros.index') }}" class="inline-flex items-center w-auto text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
          Regresar
          <svg class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 12H5m14 0-4 4m4-4-4-4"/></svg>
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
